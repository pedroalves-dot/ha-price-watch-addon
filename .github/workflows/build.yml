name: Build add-on images
# Builds the add-on here so the Pi only downloads it (building on a Pi 3 next to Home Assistant is too much).
on:
  push:
    branches: [main]
    paths: ['price_watch_runner/**', '.github/workflows/build.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { arch: aarch64, platform: linux/arm64 }
          - { arch: armv7, platform: linux/arm/v7 }
          - { arch: armhf, platform: linux/arm/v6 }
          - { arch: amd64, platform: linux/amd64 }
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          v=$(grep '^version' price_watch_runner/config.yaml | cut -d'"' -f2)
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: price_watch_runner
          platforms: ${{ matrix.platform }}
          build-args: BUILD_FROM=ghcr.io/home-assistant/${{ matrix.arch }}-base:3.20
          labels: |
            io.hass.name=Price watch checker
            io.hass.version=${{ steps.v.outputs.version }}
            io.hass.type=addon
            io.hass.arch=${{ matrix.arch }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: ghcr.io/pedroalves-dot/${{ matrix.arch }}-price-watch-checker:${{ steps.v.outputs.version }}
          push: true
          provenance: false
