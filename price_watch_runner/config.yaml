name: Price watch checker
version: "2.0.0"
slug: price_watch_runner
description: Checks your Price watch prices from your home connection, twice a day and when you ask.
url: https://github.com/pedroalves-dot/price-watch
arch:
  - aarch64
  - armv7
  - armhf
  - amd64
init: false
startup: application
boot: auto
options:
  repo: pedroalves-dot/price-watch
  github_token: ""
  telegram_bot_token: ""
  telegram_chat_id: ""
  check_times: "08:00,20:00"
schema:
  repo: str
  github_token: password
  telegram_bot_token: password
  telegram_chat_id: str
  check_times: match(^\d{1,2}:\d{2}(,\s*\d{1,2}:\d{2})*$)
